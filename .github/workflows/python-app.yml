name: CI Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check the code.
        uses: actions/checkout@v2
      
      - name: Set up the python environment.
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Install the dependencies.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests.
        run: pytest
